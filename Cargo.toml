[workspace]
resolver = "2"
members = ["common", "launcher", "tray"]

[workspace.package]
version = "0.5.13"
edition = "2021"
authors = ["ws-scrcpy-web contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/bilbospocketses/ws-scrcpy-web"

[workspace.dependencies]
anyhow = "1.0"
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Used by the operation-server (--operation-server) to SHA256-verify the
# downloaded *-full.nupkg against Velopack's authenticated UpdateInfo before
# extracting it over current/. Pure-Rust, compiled into the launcher binary
# (no runtime binary dependency, so nothing is resolved off PATH).
sha2 = "0.10"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
velopack = "1.0"
winresource = "0.1"
# Used by the launcher's operation server to extract a verified update nupkg
# (and by its `--unzip` subcommand, which nothing calls since #528).
# default-features = false drops the bzip2/zstd/lzma codec features; deflate
# is the only compression a Velopack nupkg uses. 9.0.5 is the first version
# fixed for GHSA-m665-v7pm-7grj; the readers also opt in to its
# header-consistency check, which is off by default.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
