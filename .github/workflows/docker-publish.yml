name: Docker publish

# release:published, not tag push. The Velopack legs in release.yml own the tag;
# this reuses the published release's tag name and stays decoupled from them, so
# a Docker failure never blocks an installer release or vice versa.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Inert while `platforms:` names a single native architecture, and kept
      # deliberately: it is what makes re-enabling arm64 a one-line change once
      # docs/adr/2026-09-01-linux-arm64-adb.md is lifted.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Compute channel-aware tags
        id: tags
        # Same rule as package-linux.mjs — version.includes('-beta'). Stated in
        # docker-tags.mjs rather than imported from the packaging script so the
        # workflow has no build-order dependency on the Node toolchain being set
        # up first; scripts/__tests__/docker-tags.test.mjs asserts the two agree.
        #
        # The rule that matters is the negative one: a beta must never become
        # :latest. That is unit-tested rather than first exercised on a real
        # release, because it reaches every user who follows the default tag.
        run: node .github/scripts/docker-tags.mjs "${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # amd64 only, by user ruling 2026-09-02. Google publishes no arm64
          # Linux platform-tools, so an arm64 image would build, start, serve the
          # UI and report healthy — and fail only when a user connects a device.
          # See docs/adr/2026-09-01-linux-arm64-adb.md in the qa-harness repo and
          # §16.1 of docs/specs/2026-06-09-sp4-docker-image-design.md.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
