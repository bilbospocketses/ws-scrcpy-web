name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build
      - name: Bump/blob sync
        # The auto-release bump commit is assembled from an explicit blob list.
        # Fail here if it no longer matches what bump-version.mjs writes -- the
        # drift that burned v0.1.30-beta.74.
        run: node scripts/assert-bump-blob-sync.mjs
      - name: Version sync (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/assert-version-sync.mjs ${{ github.ref_name }}
